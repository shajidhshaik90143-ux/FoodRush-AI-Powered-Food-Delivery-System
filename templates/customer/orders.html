{% extends 'base.html' %}{% block content %}<h2>My Orders</h2>{% for o in orders %}<div class="card p-3 mb-2"><b>Order #{{o.id}}</b> · {{o.restaurant.name}} · ₹{{o.total}} · <span class="badge bg-primary">{{o.status}}</span><a class="btn btn-sm btn-outline-primary float-end" href="{{url_for('orders.detail',order_id=o.id)}}">Details</a></div>{% else %}<p>No orders yet.</p>{% endfor %}{% endblock %}
