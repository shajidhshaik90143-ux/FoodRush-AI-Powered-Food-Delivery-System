{% extends 'base.html' %}{% block content %}<h2>Favorites</h2>{% for x in favorites %}<div class="card p-3 mb-2"><b>{{x.food.name}}</b> — ₹{{x.food.price}}<form method="post" action="{{url_for('customer.favorite',food_id=x.food.id)}}"><button class="btn btn-sm btn-danger">Remove</button></form></div>{% else %}<p>No favorites.</p>{% endfor %}{% endblock %}
