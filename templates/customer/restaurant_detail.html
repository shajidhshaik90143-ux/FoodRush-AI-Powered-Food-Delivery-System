{% extends 'base.html' %}{% block content %}<h2>{{restaurant.name}}</h2><p>{{restaurant.cuisine}} · ⭐ {{restaurant.rating}} · Delivery ₹{{restaurant.delivery_fee}}</p><div class="row">{% for f in restaurant.foods if f.available %}<div class="col-md-4 mb-3"><div class="card p-3"><h5>{{f.name}}</h5><p>{{f.description}}</p><b>₹{{'%.2f'|format(f.price)}}</b><form method="post" action="{{url_for('cart.add',food_id=f.id)}}"><button class="btn btn-primary mt-2">Add to Cart</button></form></div></div>{% endfor %}</div><hr><h4>Review</h4><form method="post" action="{{url_for('customer.review',restaurant_id=restaurant.id)}}"><select class="form-select mb-2" name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea class="form-control mb-2" name="comment" placeholder="Your review"></textarea><button class="btn btn-success">Submit Review</button></form>{% endblock %}
