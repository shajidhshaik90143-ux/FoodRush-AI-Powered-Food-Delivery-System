{% extends 'base.html' %}{% block content %}<h2>AI Food Recommendations 🤖</h2><div class="row">{% for f in foods %}<div class="col-md-4 mb-3"><div class="card p-3"><h5>{{f.name}}</h5><p>{{f.description}}</p><b>₹{{f.price}}</b><form method="post" action="{{url_for('cart.add',food_id=f.id)}}"><button class="btn btn-primary mt-2">Add</button></form></div></div>{% endfor %}</div>{% endblock %}
