{% extends 'base.html' %}{% block content %}<h2>Order #{{order.id}}</h2><p>Status: <b>{{order.status}}</b> · Payment: {{order.payment_status}}</p><p>Delivery: {{order.address}}</p>{% for i in order.items %}<div class="card p-2 mb-2">{{i.food.name}} × {{i.quantity}} — ₹{{i.price*i.quantity}}</div>{% endfor %}<h4>Total ₹{{order.total}}</h4>{% endblock %}
