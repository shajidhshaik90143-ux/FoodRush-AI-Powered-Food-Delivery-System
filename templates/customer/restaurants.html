{% extends 'base.html' %}{% block content %}<h2>Restaurants</h2><form class="d-flex mb-4"><input class="form-control me-2" name="q" value="{{q}}" placeholder="Search restaurants or cuisine"><button class="btn btn-primary">Search</button></form><div class="row">{% for r in restaurants %}<div class="col-md-4 mb-3"><div class="card p-3"><h4>{{r.name}}</h4><p>{{r.cuisine}} · ⭐ {{r.rating}}</p><p>{{r.description}}</p><a class="btn btn-outline-primary" href="{{url_for('customer.restaurant_detail',restaurant_id=r.id)}}">View Menu</a></div></div>{% endfor %}</div>{% endblock %}
