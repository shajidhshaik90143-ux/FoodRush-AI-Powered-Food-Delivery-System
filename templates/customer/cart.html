{% extends 'base.html' %}{% block content %}<h2>Your Cart</h2>{% for i in items %}<div class="card p-3 mb-2"><div class="d-flex justify-content-between"><div><b>{{i.food.name}}</b><br>₹{{i.food.price}} × {{i.quantity}}</div><form method="post" action="{{url_for('cart.update',item_id=i.id)}}"><input class="form-control" style="width:90px" type="number" min="0" name="quantity" value="{{i.quantity}}"><button class="btn btn-sm btn-secondary mt-1">Update</button></form><form method="post" action="{{url_for('cart.remove',item_id=i.id)}}"><button class="btn btn-sm btn-danger">Remove</button></form></div></div>{% else %}<p>Cart is empty.</p>{% endfor %}<h4>Total: ₹{{'%.2f'|format(total)}}</h4>{% if items %}<a class="btn btn-success" href="{{url_for('orders.checkout')}}">Checkout</a>{% endif %}{% endblock %}
