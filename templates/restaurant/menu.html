{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h2>Menu</h2><a class="btn btn-success" href="{{url_for('restaurant.add_food')}}">Add Food</a></div>{% for f in restaurant.foods %}<div class="card p-3 mb-2"><b>{{f.name}}</b> — ₹{{f.price}} — {{'Veg' if f.is_veg else 'Non-Veg'}}<form method="post" action="{{url_for('restaurant.delete_food',food_id=f.id)}}"><button class="btn btn-sm btn-danger">Delete</button></form></div>{% endfor %}{% endblock %}
