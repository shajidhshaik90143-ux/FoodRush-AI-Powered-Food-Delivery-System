{% extends 'base.html' %}{% block content %}<h2>Restaurant Orders</h2>{% for o in orders %}<div class="card p-3 mb-2"><b>#{{o.id}}</b> · {{o.customer.name}} · ₹{{o.total}} · {{o.status}}<form method="post" action="{{url_for('restaurant.update_status',order_id=o.id)}}" class="mt-2"><select class="form-select" name="status"><option>Pending</option><option>Confirmed</option><option>Preparing</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><button class="btn btn-primary mt-2">Update Status</button></form></div>{% endfor %}{% endblock %}
