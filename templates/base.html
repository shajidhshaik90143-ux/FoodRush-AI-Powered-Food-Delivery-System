<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}FoodRush{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('customer.dashboard') }}">🍔 FoodRush</a><div>{% if current_user.is_authenticated %}<a class="btn btn-sm btn-outline-light" href="{{ url_for('cart.cart') }}">Cart</a> <a class="btn btn-sm btn-outline-light" href="{{ url_for('orders.history') }}">Orders</a> <a class="btn btn-sm btn-warning" href="{{ url_for('auth.logout') }}">Logout</a>{% else %}<a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.login') }}">Login</a>{% endif %}</div></div></nav><main class="container py-4">{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
